name: SSE Static Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit only if Python dependency manifests exist
        shell: bash
        run: |
          if [[ -f requirements.txt ]]; then
            pip-audit -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            pip-audit
          else
            echo 'No Python dependency manifest in this orchestration repository; skipping.'
          fi
